
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.L Eletrônicos</title>
    <link rel="stylesheet" href="visual.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- TELA DE ENTRADA -->
    <section id="tela-entrada" class="painel">
        <h1>L.L Eletrônicos</h1>
        <p>Preencha seus dados para entrar na loja.</p>

        <form id="form-entrada">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="senha">Senha:</label>
            <div class="linha-senha">
                <input type="text" id="senha" required>
                <button type="button" id="btn-gerar">Gerar senha</button>
            </div>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" required>

            <label for="regiao">Região de entrega:</label>
            <select id="regiao" required>
                <option value="">Selecione sua região</option>
                <option value="Sudeste">Sudeste</option>
                <option value="Sul">Sul</option>
                <option value="Centro-Oeste">Centro-Oeste</option>
                <option value="Nordeste">Nordeste</option>
                <option value="Norte">Norte</option>
            </select>

            <p id="dica-frete">Selecione uma região para ver o frete.</p>
            <p id="erro"></p>

            <button type="submit">Entrar na loja</button>
        </form>
    </section>

    <!-- TELA DA LOJA -->
    <section id="tela-loja" hidden>
        <header>
            <h1>L.L Eletrônicos</h1>
            <p id="boas-vindas"></p>
        </header>

        <main class="painel-produtos">
            <h2>Nossos produtos</h2>

            <div class="produtos">

                <!-- PRODUTO 1 -->
                <article class="produto">
                    <img src="imagens/cigarro.jpg" alt="Geekvape">
                    <h3>Geekvape</h3>
                    <p>Mod Kit Aegis Legend 5 200W</p>
                    <strong>R$ 302,95</strong>
                </article>

                <!-- PRODUTO 2 -->
                <article class="produto">
                    <img src="imagens/mouseGamer.jpg" alt="Mouse Gamer">
                    <h3>Mouse Gamer</h3>
                    <p>MCHOSE G3 V2</p>
                    <strong>R$ 147,99</strong>
                </article>

                <!-- PRODUTO 3 -->
                <article class="produto">
                    <img src="imagens/foneAzul.jpg" alt="Fone Bluetooth">
                    <h3>Fone Bluetooth</h3>
                    <p>JBL Tune 500BT Azul</p>
                    <strong>R$ 321,10</strong>
                </article>

            </div>
        </main>
    </section>

</body>
</html>
